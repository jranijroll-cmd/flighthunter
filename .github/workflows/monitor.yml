name: Monitor flights
on:
  workflow_dispatch:
  schedule:
    # UTC candidates for Europe/Rome; Python filters the inactive CET/CEST times.
    - cron: '10 22 * * *'
    - cron: '10 23 * * *'
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
permissions:
  contents: write
concurrency:
  group: flighthunter-history
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run monitor
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python -m flighthunter --scheduled-cron "$SCHEDULE_CRON"
          else
            python -m flighthunter
          fi
      - name: Persist JSONL history
        run: |
          if [ -f data/prices.jsonl ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/prices.jsonl
            if ! git diff --cached --quiet; then
              git commit -m 'chore: record flight price observations [skip ci]'
              git pull --rebase origin "${{ github.event.repository.default_branch }}"
              git push origin HEAD:"${{ github.event.repository.default_branch }}"
            fi
          fi
