[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flighthunter"
version = "0.1.0"
description = "Personal flight price monitor"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
flighthunter = "flighthunter.cli:main"

[tool.setuptools.packages.find]
include = ["flighthunter*"]
